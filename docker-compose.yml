services:
  postgres:
    image: postgres:16-alpine
    container_name: tgwealthvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tgwealth
      POSTGRES_PASSWORD: tgwealth
      POSTGRES_DB: tgwealthvault
    ports:
      - "5432:5432"
    volumes:
      - tgwealth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgwealth -d tgwealthvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tgwealth_pgdata:
